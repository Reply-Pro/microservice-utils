name: Set up nox on uv
description: >-
  Python, uv and nox for a job that runs nox sessions. Run the sessions with
  `nox --default-venv-backend uv` so they install with uv rather than pip.

inputs:
  python-version:
    description: The Python version to set up.
    required: true

runs:
  using: composite
  steps:
    # No pip cache: it held the PyTorch wheels the heavy extras pull, and
    # restoring and saving that took longer than the install it spared.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    # No uv cache either: setup-uv does not prune it by default, so it saved
    # PyTorch and its CUDA wheels, 2.8 GB per job and ~20s to save, and four
    # jobs would overflow the repository's 10 GB cache. uv downloads them
    # again in seconds.
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false

    # Plain nox: its uv backend runs the uv set up above, not a second copy.
    - name: Install nox
      shell: bash
      run: timeout 5m uv pip install --system nox
